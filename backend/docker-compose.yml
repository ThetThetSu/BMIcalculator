version: "3.8"

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learn_backend}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jjkttsse2025}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Node.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodejs_app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: ${APP_PORT:-5000}
      DATABASE_URL: postgresql://postgres:jjkttsse2025@postgres:5432/${POSTGRES_DB:-learn_backend}
    ports:
      - "${APP_PORT:-5000}:5000"

volumes:
  postgres_data:
